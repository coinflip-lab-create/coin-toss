<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동전 던지기</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; padding:32px 16px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#202638; background:linear-gradient(145deg,#eef3ff,#f8f5ff); }
  main { width:min(760px,100%); margin:0 auto; padding:28px; background:white; border-radius:24px; box-shadow:0 16px 50px rgba(42,55,95,.12); }
  h1 { margin:0 0 8px; font-size:clamp(26px,5vw,36px); }
  .sub { margin:0 0 26px; color:#68718a; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; }
  input { flex:1; min-width:150px; padding:14px 16px; border:1px solid #d8deeb; border-radius:12px; font-size:17px; }
  button { border:0; border-radius:12px; padding:14px 20px; background:#4c63dc; color:white; font-size:16px; font-weight:700; cursor:pointer; }
  button:hover { background:#394fc5; }
  button:disabled { opacity:.55; cursor:wait; }
  #message { min-height:24px; margin:12px 0; color:#c04444; }
  .animation-stage { display:none; min-height:154px; margin:18px 0; border-radius:18px; background:linear-gradient(135deg,#f6f7fc,#edf0f9); align-items:center; justify-content:center; flex-direction:column; gap:10px; overflow:hidden; }
  .animation-stage.show { display:flex; }
  .preview-row { display:flex; align-items:center; justify-content:center; gap:12px; min-height:86px; }
  .preview-coin { width:68px; height:68px; border-radius:50%; display:grid; place-items:center; overflow:hidden; background:transparent; border:0; box-shadow:none; opacity:.25; transform:scale(.82); transition:opacity .09s linear,transform .09s linear; }
  .preview-coin.active { opacity:1; transform:scale(1.08); }
  .preview-coin img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .stage-text { color:#68718a; font-size:14px; }
  .panel { padding-top:20px; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .stat { padding:20px; border-radius:16px; background:#f3f5fc; }
  .stat strong { display:block; font-size:32px; margin:5px 0; }
  .heads { color:#a87316; } .tails { color:#4c63dc; }
  .stat small { color:#788198; }
  .summary-total { margin-top:14px; color:#68718a; }
  h2 { font-size:19px; margin:0; }
  @keyframes reveal { to { opacity:1; transform:translateY(0) scale(1); } }
  .coin-face { width:76px; height:76px; border-radius:50%; display:grid; place-items:center; position:relative; overflow:hidden; background:transparent; border:0; box-shadow:none; }
  .coin-art { position:relative; z-index:1; display:grid; place-items:center; width:100%; height:100%; }
  .coin-art img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .coin-face .big { font-family:Georgia,serif; font-weight:500; font-size:27px; letter-spacing:-1px; color:#656b72; }
  .crane { width:59px; height:59px; }
  .empty { grid-column:1/-1; padding:30px; text-align:center; color:#858da2; background:#fafbff; border-radius:14px; }
  .note { margin:22px 0 0; color:#8a91a3; font-size:12px; }
  [hidden] { display:none !important; }
  @media(prefers-reduced-motion:reduce) { .coin{animation:none;opacity:1;transform:none}.preview-coin{transition:none} }
  @media(max-width:480px) { main{padding:21px}.controls button{width:100%} }
</style>
</head>
<body>
<main>
  <h1>🪙 동전 던지기</h1>
  <p class="sub">원하는 횟수를 입력하고 동전을 던져 보세요!</p>
  <div class="controls">
    <input id="count" type="number" min="1" max="10000" value="10" placeholder="던질 횟수">
    <button id="toss">동전 던지기</button>
  </div>
  <div id="message" role="status"></div>

  <div class="animation-stage" id="animationStage" aria-live="polite">
    <div class="preview-row" id="previewRow" aria-hidden="true">
      <div class="preview-coin">500</div>
      <div class="preview-coin active">500</div>
      <div class="preview-coin">500</div>
      <div class="preview-coin">500</div>
      <div class="preview-coin">500</div>
    </div>
    <div class="stage-text" id="stageText">동전 던지는 중...</div>
  </div>
<section class="panel" id="resultPanel" aria-live="polite">
    <div class="stats">
      <div class="stat heads">앞면<strong id="heads">0</strong><small id="headsPct">0%</small></div>
      <div class="stat tails">뒷면<strong id="tails">0</strong><small id="tailsPct">0%</small></div>
    </div>
    <div class="summary-total" id="total">아직 동전을 던지지 않았어요.</div>
  </section>
<p class="note">앞면과 뒷면 모두 실제 500원 동전 사진으로 표시됩니다.</p>
</main>

function makeCoin(isHead,index,delay){
  const coin=document.createElement('div'); coin.className=`coin ${isHead?'head':'tail'}`;
  coin.style.setProperty('--delay',`${delay}ms`);
  const face=document.createElement('div'); face.className='coin-face';
  const art=document.createElement('div'); art.className='coin-art';
  if(isHead) art.innerHTML=`<img src="${coinFrontImage}" alt="500원 동전 앞면의 학 문양">`;
  else { const image=document.createElement('img'); image.src=coinBackImage; image.alt='500원 동전 뒷면'; art.appendChild(image); }
  face.appendChild(art);
  const label=document.createElement('span'); label.textContent=`${index}번째 · ${isHead?'앞면':'뒷면'}`;
  coin.append(face,label); return coin;
}

function previewCoinMarkup(isHead){
  return `<img src="${isHead ? coinFrontImage : coinBackImage}" alt="">`;
}

const coinFrontImageMarkup = `<img src="${coinFrontImage}" alt="500원 동전 앞면" style="width:100%;height:100%;object-fit:contain">`;

tossButton.addEventListener('click',()=>{
  const n=Number(countInput.value);
  if(!Number.isInteger(n)||n<1||n>10000){
    message.textContent='1부터 10,000 사이의 정수를 입력해 주세요.';
    return;
  }
  message.textContent='';
  tossButton.disabled=true;
  animationStage.classList.add('show');

  // Count only; no per-coin result elements are created, so 10,000 tosses stay lightweight.
  let heads=0;
  for(let i=0;i<n;i++){
    if(Math.random()<0.5) heads++;
  }
  const tails=n-heads;

  const previewCoins=[...document.querySelectorAll('.preview-coin')];
  let previewIndex=0;
  const previewTimer=window.setInterval(()=>{
    previewCoins.forEach((coin,index)=>{
      coin.innerHTML=Math.random()<0.5 ? coinFrontImageMarkup : '500';
      coin.classList.toggle('active',index===previewIndex%previewCoins.length);
    });
    previewIndex++;
  },95);

  window.setTimeout(()=>{
    window.clearInterval(previewTimer);
    animationStage.classList.remove('show');

    document.getElementById('heads').textContent=heads.toLocaleString('ko-KR');
    document.getElementById('tails').textContent=tails.toLocaleString('ko-KR');
    document.getElementById('headsPct').textContent=`${(heads/n*100).toFixed(1)}%`;
    document.getElementById('tailsPct').textContent=`${(tails/n*100).toFixed(1)}%`;
    document.getElementById('total').textContent=`총 ${n.toLocaleString('ko-KR')}회 던졌어요.`;

    window.setTimeout(()=>{tossButton.disabled=false;},250);
  },1500);
});
